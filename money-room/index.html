<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>8인의 방</title>
<style>
:root{--bg:#1f2230;--ink:#f4f0e6;--sub:#a7a8b5;--card:#2b2f40;--line:#3c4156;--pri:#f2b632;--bad:#ef6a5a;--good:#58c08b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
#app{max-width:460px;margin:auto;padding:14px 16px 22px;min-height:100dvh;display:flex;flex-direction:column;gap:10px}
h1{font-size:30px;line-height:1.25;margin:24px 0 4px}h2{font-size:21px;margin:0}p{margin:0}.sub{color:var(--sub);font-size:14px}
button{font:inherit;color:inherit;border:0;cursor:pointer}
.main{background:var(--pri);color:#2a2410;font-weight:700;border-radius:14px;padding:15px;width:100%;font-size:18px}
.prize{text-align:center;background:var(--card);border-radius:16px;padding:10px}.prize b{display:block;font-size:32px;color:var(--pri);line-height:1.2}
.ppl{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.p{background:var(--card);border:2px solid transparent;border-radius:12px;padding:6px 3px;text-align:center;font-size:12px;width:100%}
.p.me{border-color:var(--pri)}.p.al{border-color:var(--good)}.p.out{opacity:.3}.p svg{display:block;margin:auto}
.hp{height:6px;background:#191b26;border-radius:3px;overflow:hidden;margin:3px 4px}.hp i{display:block;height:100%;background:var(--good)}
.hate{color:var(--bad);min-height:17px;font-size:11px}
.log{background:var(--card);border-radius:12px;padding:9px 12px;font-size:14px;min-height:74px}
.menu{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:auto}
.menu button{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;text-align:left}
.menu b{display:block}.menu small{color:var(--sub)}.menu .sneak{border-color:var(--bad)}
.big{font-size:38px;font-weight:800;color:var(--pri)}
#stage{position:fixed;top:0;left:50%;transform:translateX(-50%);width:100%;max-width:460px;height:36dvh;z-index:5}#app{margin-top:36dvh;min-height:64dvh}h1{margin-top:4px;font-size:24px}
.fl{position:absolute;color:#fff;background:#d9362bdd;font-weight:800;font-size:17px;padding:2px 8px;border-radius:8px;transform:translate(-50%,0);white-space:nowrap;pointer-events:none;animation:fl 2.2s forwards;z-index:9}@keyframes fl{to{margin-top:-46px;opacity:0}}.loss{color:#fff;background:#d9362b;border-radius:8px;padding:3px 8px;font-weight:800;font-size:18px;display:inline-block;margin-top:3px}
.modal{background:#3a2024;border:2px solid #ef6a5a;border-radius:16px;padding:14px}.modal .two{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.modal .ghost{background:#2b2f40;border-radius:12px;padding:12px}.modal .ok{background:#ef6a5a;border-radius:12px;padding:12px;font-weight:700}
#hud{position:absolute;top:6px;left:50%;transform:translateX(-50%);background:#000a;border-radius:10px;padding:3px 12px;font-weight:800;color:#f2b632;white-space:nowrap;z-index:8;font-size:17px}#hud small{color:#fff;font-size:12px;font-weight:600}
html,body{height:100dvh;overflow:hidden}#stage{height:30dvh}
#app{margin-top:30dvh;height:70dvh;min-height:0;padding:5px 12px calc(6px + env(safe-area-inset-bottom));gap:5px;overflow:hidden}
.prize{padding:2px 8px;border-radius:10px;flex:none}.prize .sub{font-size:12px}.prize b{display:inline;font-size:16px;margin-left:6px}.loss{font-size:13px;padding:0 6px;margin:0 0 0 6px}
.ppl{gap:3px;flex:none}.p{padding:2px 1px;font-size:11px;line-height:1.15;border-radius:8px}.p svg{width:20px;height:20px}.hp{height:3px;margin:1px 3px}.hate{min-height:0;font-size:10px}
.log{flex:1 1 0;min-height:30px;overflow:auto;font-size:13px;padding:4px 8px}
.menu{margin-top:0;gap:4px;flex:none}.menu button{padding:5px 8px;border-radius:10px}.menu b{font-size:14px}.menu small{font-size:11px;line-height:1.2;display:block}
.main{padding:10px}.modal{padding:7px 10px;font-size:14px;flex:none}.modal .two{margin-top:5px}.modal .ghost,.modal .ok{padding:8px}.big{font-size:28px;line-height:1.1}
#app>p{font-size:14px}h1{font-size:20px;margin:0}
body{background:radial-gradient(120% 70% at 50% 0,#2c2438,#12121b 75%)}
#stage{border-radius:0 0 22px 22px;overflow:hidden;box-shadow:0 8px 24px #0009}#stage canvas{display:block}
#hud{top:8px;background:#0d0d15cc;border:1px solid #f2b63266;border-radius:99px;padding:3px 14px;backdrop-filter:blur(6px);font-size:16px}
.prize{background:none;text-align:left;display:flex;align-items:center;gap:4px;padding:2px}.prize b{color:#fff;font-size:15px}
.p{background:#ffffff0d;border:1.5px solid #ffffff14;transition:transform .12s}.p[data-v]{background:#f2b6321f;border-color:#f2b63280}.p[data-v]:active{transform:scale(.94)}
.p.me{border-color:#f2b632;background:#f2b6321a}.p.al{border-color:#58c08b;box-shadow:0 0 8px #58c08b66}
.log{background:#ffffff0a;border:0;border-left:3px solid #f2b632;border-radius:4px 10px 10px 4px;color:#e7e3d8}
.menu button{background:linear-gradient(180deg,#34344a,#28283a);border:1px solid #ffffff1c;box-shadow:0 2px 0 #0007;transition:transform .1s}.menu button:active{transform:translateY(2px);box-shadow:none}
.menu .sneak{border-color:#ef6a5a99}.menu .main{background:linear-gradient(180deg,#ffcf5c,#eda921);color:#2a1e05;border:0}
.modal{background:#2a1a22;border:1.5px solid #ef6a5a;box-shadow:0 6px 18px #0008}
.fl{font-size:12px;padding:1px 6px;border-radius:99px;background:#17171fd9;border:1px solid #ef6a5a;animation-duration:1.8s}
.big{color:#ffcf5c;text-shadow:0 2px 12px #f2b63255}
@media(min-height:740px){#stage{height:38dvh}#app{margin-top:38dvh;height:62dvh}}
</style></head><body><div id="stage"><div id="hud"></div></div><div id="app"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const NAMES=['나','곰돌','여우','토끼','부엉','돼지','고양','오리'],COL=['#f2b632','#b58a5f','#e8743b','#d98cb3','#7f8fd0','#e39aa0','#8fbf9a','#6fc0d8'];
const FOOD=[{n:'굶기',c:0,h:0},{n:'물 한 병',c:150,h:8},{n:'밥 한 끼',c:600,h:25},{n:'몰래 치킨',c:2000,h:50,sneak:1}];
const START=48000,DAYS=14,VOTE=[3,6,9,12],DROP=15;
const MIND=[['복수형','나를 찍은 사람을 기억해 되갚습니다'],['동조형','표가 몰린 쪽을 따라갑니다'],['의리형','은혜를 받으면 꼭 갚습니다'],['불안형','상금이 줄수록 날카로워집니다'],['시기형','배부르고 멀쩡한 사람을 미워합니다'],['계산형','쫓아낼수록 내 몫이 커진다고 봅니다']];
const ACT=[{k:'rest',n:'쉬기',d:'체력 +6'},{k:'sorry',n:'사과하기',d:'내 미움 -2'},{k:'gift',n:'물 나눠 주기',d:'150만원 · 한 명이 내 편으로',t:1},{k:'gossip',n:'뒷담화',d:'한 명 미움 +2 · 들킬 수 있음',t:1},{k:'ally',n:'동맹 제안',d:'한 명에게 표 부탁 · 거절될 수 있음',t:1},{k:'steal',n:'상금 빼돌리기',d:'1,000만원 내 주머니로 · 들키면 큰일'}];
const FC={화남:'#ef6a5a',굶주림:'#e8a03b',불안:'#b79be0',고마움:'#58c08b',의심:'#6fc0d8',위축:'#a7a8b5'};
const $=document.getElementById('app'),fast=location.search.includes('fast');
const R=n=>Math.floor(Math.random()*n);
let P,prize,day,log,stash,voted,p0=START;
let cid=0;
function camps(){const ids=[...new Set(live().map(p=>p.camp).filter(Boolean))];
  ids.forEach(id=>{const m=live().filter(p=>p.camp==id);
    if(m.length<2)m.forEach(p=>p.camp=0);
    else if(Math.random()<.1){if(m[0].seen)log.push(`${m.map(p=>p.n).join('와 ')}가 크게 다퉜습니다. 패거리가 깨졌습니다.`);m.forEach(p=>p.camp=0)}});
  const free=live().slice(1).filter(p=>!p.camp&&!p.ally).sort(()=>Math.random()-.5),cur=[...new Set(live().map(p=>p.camp).filter(Boolean))];
  if(free.length&&cur.length&&Math.random()<.2){const p=free.pop(),id=cur[R(cur.length)];p.camp=id;p.seen=Math.random()<.6;if(p.seen)log.push(`${p.n}가 ${live().find(x=>x.camp==id&&x!=p).n} 쪽에 붙은 것 같습니다.`)}
  else if(free.length>=2&&Math.random()<.45){const x=free.pop(),y=free.pop();x.camp=y.camp=++cid;x.seen=y.seen=Math.random()<.6;if(x.seen)log.push(`${x.n}와 ${y.n}가 복도에서 귓속말을 나눕니다.`)}}
function feelAll(){camps();const lost=p0-prize;P.forEach(p=>{if(!p.on||!p.ally)return;p.trust-=4+(P[0].hate>=4?6:0)+(lost>=2000?4:0);if(p.trust<=30){p.ally=false;p.mad=day;log.push(`${p.n}가 더 이상 나를 믿지 않습니다. 동맹이 끊겼습니다.`)}});P.forEach(p=>{if(!p.on)return;
  if(p.hp<30)p.f='굶주림';
  else if(!p.i){p.f=p.hate>=4?'위축':'평온';return}
  else if(p.mad==day||voted[voted.length-1]==p.i)p.f='화남';
  else if(p.thx==day)p.f='고마움';
  else if(lost>=2000||(p.mind==3&&lost>=1000))p.f='불안';
  else p.f=Math.random()<.35?'의심':'평온'})}
const man=v=>v>=10000?(v/10000).toFixed(v%10000?1:0)+'억원':v.toLocaleString()+'만원';
const live=()=>P.filter(p=>p.on);
function face(c,sad,f){return `<svg width="34" height="34" viewBox="0 0 32 32"><circle cx="16" cy="16" r="14" fill="${c}"/><circle cx="11" cy="14" r="2" fill="#222"/><circle cx="21" cy="14" r="2" fill="#222"/>${f=='화남'?'<path d="M8 10l6 2M24 10l-6 2" stroke="#222" stroke-width="2"/>':''}<path d="M11 ${sad?23:20}q5 ${sad?-5:5} 10 0" stroke="#222" stroke-width="2" fill="none" stroke-linecap="round"/></svg>`}
function grid(tap){return `<div class="ppl">${P.map(p=>{const t=tap&&p.on&&p.i&&(!tap.length||tap.includes(p))?`data-v="${p.i}"`:'';return `<button class="p ${p.on&&p.ally?'al':''} ${p.i?'':'me'} ${p.on?'':'out'}" ${t}>${face(COL[p.i],['굶주림','화남','불안','위축'].includes(p.f),p.f)}${p.n}<div style="font-weight:700;color:${FC[p.f]||'#a7a8b5'}">${p.on?p.f:'퇴장'}</div><div class="hp"><i style="width:${p.hp}%"></i></div><div class="hate">${p.hate?'미움 '+p.hate:''}${p.like>0?' 호감 '+p.like:''}${p.on&&p.ally?`<b style="color:#58c08b"> 동맹 ${p.trust}%</b>`:''}${p.on&&p.camp&&p.seen?'<b style="color:#b79be0"> 수상</b>':''}</div></button>`}).join('')}</div>`}
function home(){$.innerHTML=`<h1>방 안의 8명,<br>상금 4억 8천만원</h1><p class="sub">14일을 버티면 남은 상금을 살아남은 사람끼리 나눕니다.<br>그런데 물 한 병도 상금에서 빠져나가요.<br>많이 먹으면 미움받고, 3일마다 투표로 쫓겨납니다.</p>
<div class="ppl" style="margin-top:10px">${COL.map((c,i)=>`<div class="p">${face(c)}${NAMES[i]}</div>`).join('')}</div>
<div class="menu" style="grid-template-columns:1fr"><button class="main" id="go">방에 들어가기</button><p class="sub" style="text-align:center">가상의 돈으로 하는 게임입니다${best()?` · 최고 ${man(best())}`:''}</p></div>`;go.onclick=start}
function A3reset(){if(window.stageReset)stageReset()}
function best(){try{return +localStorage.getItem('room')||0}catch(e){return 0}}
function start(){A3reset();P=NAMES.map((n,i)=>({i,n,hp:70,hate:0,like:0,on:true,greed:Math.random()*.5}));const m=[0,1,2,3,4,5].sort(()=>Math.random()-.5);P.slice(1).forEach((p,k)=>p.mind=m[k%6]);stash=0;voted=[];prize=START;p0=START;P.forEach(p=>p.f='평온');day=1;log=['첫날입니다. 다들 서로 눈치만 봅니다.'];draw()}
function draw(){const me=P[0];$.innerHTML=`<div class="prize"><span class="sub">${day}일째 / 14일 · 내 몫 예상</span><b>${man(Math.floor(prize/live().length)+stash)}</b><span class="sub">전체 상금 ${man(prize)} · ${live().length}명이 나눔</span></div>${grid()}
<div class="log">${log.join('<br>')}</div><p style="font-weight:700">오늘 뭘 먹을까? 내 체력 ${me.hp}${VOTE.includes(day)?' · 오늘 밤 투표':''}</p>
<div class="menu">${FOOD.map((f,i)=>`<button class="${f.sneak?'sneak':''}" data-f="${i}"><b>${f.n}</b><small>${f.c?man(f.c)+' · 체력 +'+f.h:'체력이 깎입니다'}${f.sneak?' · 들키면 큰일':''}</small></button>`).join('')}</div>`;
document.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>think(+b.dataset.f))}
function think(i){const f=FOOD[i];if(!f.c)return eat(i);const n=live().length,now=Math.floor(prize/n),aft=Math.floor(Math.max(0,prize-f.c)/n),hun=live().filter(p=>p.i&&p.hp<35).length,box=document.querySelector('.menu');
 box.outerHTML=`<div class="modal"><b>${f.n}, 정말 살까요?</b><p style="margin-top:6px">전체 상금 <b>-${man(f.c)}</b> · 내 몫 ${man(now)} → <b>${man(aft)}</b></p><p class="sub">${f.sneak?'들키면 미움이 크게 쌓입니다.':f.c>=600?'모두가 보는 앞에서 삽니다. 미움이 쌓입니다.':'조용히 넘어갈 수 있습니다.'}${hun?` 배고픈 사람이 ${hun}명 지켜봅니다.`:''}</p><div class="two"><button class="ghost" id="no">참는다</button><button class="ok" id="yes">그래도 산다</button></div></div>`;
 yes.onclick=()=>eat(i);no.onclick=draw}
function buy(p,f){prize=Math.max(0,prize-f.c);p.hp=Math.min(100,p.hp+f.h)}
function eat(i){log=[];p0=prize;const me=P[0],f=FOOD[i];buy(me,f);
  if(f.sneak){if(Math.random()<.4){me.hate+=4;log.push('치킨 냄새에 들켰습니다! 모두가 나를 노려봅니다.')}else log.push('아무도 모르게 치킨을 먹었습니다.')}
  else if(f.c>=600){me.hate+=2;log.push(`내가 ${f.n}를 사자 공기가 싸늘해집니다.`)}
  live().slice(1).forEach(p=>{
    const k=p.hp<35?(p.hp<20||Math.random()<p.greed?2:1):(Math.random()<p.greed*.3?2:0);
    if(k==3||(p.hp<25&&Math.random()<p.greed)){buy(p,FOOD[3]);p.hate+=3;log.push(`${p.n}가 치킨을 시켰습니다! ${man(FOOD[3].c)} 증발.`)}
    else if(k&&p.hate>=3&&Math.random()<.4){window.stageFloat&&stageFloat(p.i,'...참자');if(log.length<3)log.push(`${p.n}가 밥을 들었다가 눈치를 보며 내려놓았습니다.`)}
    else if(k){buy(p,FOOD[k]);if(k==2){p.hate+=1;if(log.length<3)log.push(`${p.n}가 밥을 먹었습니다.`)}}});
  live().forEach(p=>p.hp-=DROP);
  const fall=live().filter(p=>p.hp<=0);fall.forEach(p=>{p.on=false;log.push(`${p.n}가 쓰러져 기권했습니다.`)});
  if(!me.on)return end('쓰러져 기권했습니다');
  act()}
function after(){if(VOTE.includes(day)&&live().length>2)return vote();next()}
function act(){$.innerHTML=`<div class="prize"><span class="sub">${day}일째 저녁</span><b>${man(prize)}</b>${p0>prize?`<span class="loss">오늘 -${man(p0-prize)}</span>`:''}</div>${grid()}<div class="log">${log.join('<br>')||'조용한 하루였습니다.'}</div><p style="font-weight:700">오늘 저녁엔 뭘 할까?</p><div class="menu">${ACT.map((a,i)=>`<button data-a="${i}"><b>${a.n}</b><small>${a.d}</small></button>`).join('')}</div>`;
document.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{const a=ACT[+b.dataset.a];a.t?target(a):doAct(a)})}
function target(a){$.innerHTML=`<p style="font-weight:700;margin-top:14px">${a.n}: 누구에게 할까요?</p>${grid(true)}`;document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>doAct(a,P[+b.dataset.v]))}
function doAct(a,t){const me=P[0],c=Math.random();log=[];
 if(a.k=='rest')me.hp=Math.min(100,me.hp+6);
 if(a.k=='sorry')me.hate=Math.max(0,me.hate-2);
 if(a.k=='gift'){prize=Math.max(0,prize-150);t.hp=Math.min(100,t.hp+8);t.like+=t.mind==2?3:2;t.thx=day;if(t.ally)t.trust=Math.min(100,t.trust+20);log.push(`${t.n}가 고마워합니다.`)}
 if(a.k=='gossip'){t.hate+=2;if(c<.3){t.like-=3;t.mad=day;me.hate+=2;log.push(`${t.n} 뒷담화를 들켰습니다!`)}else log.push(`${t.n}를 보는 눈길이 달라졌습니다.`)}
 if(a.k=='ally'){const ok=c<.35+t.like*.15+(t.mind==5?.2:0);if(t.ally){t.trust=Math.min(100,t.trust+10);log.push(`${t.n}와 다시 손을 맞잡았습니다.`)}else if(ok){t.camp=0;t.ally=true;t.trust=70;t.thx=day;log.push(`${t.n}와 동맹! 이제 내가 찍는 사람을 함께 찍습니다.`)}else log.push(`${t.n}가 고개를 돌립니다.`)}
 if(a.k=='steal'){prize=Math.max(0,prize-1000);stash+=1000;if(c<.3){me.hate+=5;stash-=1000;log.push('빼돌리다 들켜 돈을 뺏겼습니다! 방이 뒤집혔습니다.')}else log.push('아무도 모르게 주머니가 두둑해졌습니다.')}
 feelAll();after()}
function next(){day++;if(day>DAYS)return end();draw()}
function vote(){$.innerHTML=`<div class="prize"><span class="sub">${day}일째 밤 · 한 명을 내보냅니다</span><b>${man(prize)}</b></div><div class="log">${log.join('<br>')||'조용한 하루였습니다.'}</div><p style="font-weight:700">누구를 내보낼까요?${P.some(p=>p.on&&p.ally)?` 동맹 ${P.filter(p=>p.on&&p.ally).length}명이 따라 찍습니다`:''}</p>${grid(true)}`;
  document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>tally(+b.dataset.v))}
