<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>출발선 머니게임</title>
<style>
:root{--bg:#fff8ec;--ink:#3a3128;--sub:#8a7a68;--card:#fff;--line:#eadfce;--pri:#e8743b;--good:#2f9e6e;--bad:#d9483b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
#app{max-width:460px;margin:auto;padding:14px 16px 24px;min-height:100dvh;display:flex;flex-direction:column;gap:12px}
h1{font-size:30px;line-height:1.2;margin:18px 0 4px}h2{font-size:21px;margin:0;line-height:1.3}
p{margin:0}.sub{color:var(--sub);font-size:14px}
button{font:inherit;color:inherit;border:0;cursor:pointer}
.main{background:var(--pri);color:#fff;font-weight:700;border-radius:14px;padding:15px;font-size:18px;width:100%}
.ghost{background:#f1e6d6;border-radius:14px;padding:12px;width:100%;font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px}
.row{display:grid;grid-template-columns:34px 1fr;gap:8px;align-items:center;padding:5px 0}
.row.dead{opacity:.5}
.nm{display:flex;justify-content:space-between;gap:8px;font-size:14px}.nm b{white-space:nowrap}
.me .nm{color:var(--pri);font-weight:700}
.track{height:10px;background:#f3ebdf;border-radius:6px;overflow:hidden;margin-top:3px}
.bar{height:100%;border-radius:6px;transition:width .7s}
.mood{border-radius:14px;padding:11px 13px;font-weight:600}
.m0{background:#e5f3ea}.m1{background:#fde3d8}.m2{background:#e3e6f3}
.picks{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pick{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:10px 4px;text-align:center}
.pick:active{border-color:var(--pri)}.pick:disabled{opacity:.5}
.pick svg{display:block;margin:0 auto 4px}.pick b{display:block}.pick small{color:var(--sub);font-size:12px;line-height:1.25;display:block}
.news{min-height:24px;font-weight:700;text-align:center}.up{color:var(--good)}.down{color:var(--bad)}
.big{font-size:32px;font-weight:800;color:var(--pri);line-height:1.2}
.top{display:flex;justify-content:space-between;align-items:center;font-weight:700}
.btns{display:grid;gap:8px;margin-top:auto}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
</style></head><body><div id="app"></div>
<script>
const D=__DATA__;
const WON=1400,COL=['#e8743b','#4c8dc9','#2f9e6e','#a06cc4','#c9a227'];
const KO=new Intl.DisplayNames(['ko'],{type:'region'});
const TOTAL=D.reduce((a,c)=>a+c[3],0);
const PICKS=[{n:'금고',d:'거의 그대로',m:[1.25,1.25,1.25]},{n:'씨앗밭',d:'오르내림',m:[2.2,1.2,.55]},{n:'로켓',d:'대박 아니면 쪽박',m:[5,.8,.1]}];
const MOODS=[{t:'세상이 잔잔합니다',c:'m0',p:[.55,.35]},{t:'모두가 돈 번 얘기뿐입니다',c:'m1',p:[.25,.15]},{t:'다들 겁먹고 팔고 있습니다',c:'m2',p:[.7,.25]}];
const OUT=[['호황이 왔습니다!','up'],['그럭저럭 지나갑니다','' ],['금융위기가 터졌습니다!','down']];
const RIVAL=[['금고파',()=>0],['씨앗파',()=>1],['로켓파',()=>2],['눈치파',m=>m==1?0:m==2?2:1]];
const AGES=[20,30,40,50,60,70,80];
function rng(s){return()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function born(r){let x=r()*TOTAL;for(const c of D){x-=c[3];if(x<=0)return c}return D[0]}
function gauss(r){return Math.sqrt(-2*Math.log(1-r()))*Math.cos(6.283*r())}
function deal(seed){
  const r=rng(seed),ppl=[0,1,2,3,4].map(i=>{const c=born(r),die=Math.round(Math.min(98,Math.max(28,c[2]+gauss(r)*11)));
    return{i,c,code:c[0],name:KO.of(c[0]),die,money:c[1]*.5*WON,alive:true,name2:i?RIVAL[i-1][0]:'나'}});
  const world=AGES.map(()=>{const m=r()<.5?0:r()<.5?1:2,x=r(),p=MOODS[m].p;return{m,o:x<p[0]?0:x<p[0]+p[1]?1:2}});
  return{ppl,world,seed};
}
function step(p,w,pick,age){ if(age>=p.die){p.alive=false;return}
  p.money*=PICKS[pick].m[w.o]; if(age<60)p.money+=p.c[1]*WON;}
function won(v){v=Math.round(v);if(v>=1e12)return(v/1e12).toFixed(1)+'조원';if(v>=1e8)return(v/1e8).toFixed(1)+'억원';if(v>=1e4)return Math.round(v/1e4).toLocaleString()+'만원';return v.toLocaleString()+'원'}
function face(c,sad){return `<svg width="32" height="32" viewBox="0 0 32 32"><circle cx="16" cy="16" r="14" fill="${c}"/><circle cx="11" cy="14" r="2" fill="#fff"/><circle cx="21" cy="14" r="2" fill="#fff"/><path d="M11 ${sad?23:20}q5 ${sad?-5:5} 10 0" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round"/></svg>`}
const ICON=[`<svg width="40" height="40" viewBox="0 0 40 40"><rect x="7" y="8" width="26" height="25" rx="4" fill="#8a7a68"/><circle cx="20" cy="20" r="6" fill="#f1e6d6"/></svg>`,
`<svg width="40" height="40" viewBox="0 0 40 40"><path d="M20 34V16" stroke="#2f9e6e" stroke-width="3"/><path d="M20 20C10 20 9 11 9 11s11-1 11 9zM20 16c0-9 10-9 10-9s1 10-10 9z" fill="#2f9e6e"/></svg>`,
`<svg width="40" height="40" viewBox="0 0 40 40"><path d="M20 4c7 7 8 16 5 24H15C12 20 13 11 20 4z" fill="#e8743b"/><circle cx="20" cy="16" r="3" fill="#fff"/><path d="M15 28l-5 6 8-2zM25 28l5 6-8-2z" fill="#c9a227"/></svg>`];
function store(){try{return JSON.parse(localStorage.getItem('mg')||'{}')}catch(e){return{}}}
function save(s){try{localStorage.setItem('mg',JSON.stringify(s))}catch(e){}}
const $=document.getElementById('app');
const q=new URLSearchParams(location.search);
let G,round;
function daily(){const d=new Date();return d.getFullYear()*1e4+(d.getMonth()+1)*100+d.getDate()}
function board(){const max=Math.log10(Math.max(...G.ppl.map(p=>p.money),1e7)),min=5.5;
  const s=[...G.ppl].sort((a,b)=>b.money-a.money);
  return `<div class="card">${s.map(p=>`<div class="row ${p.i?'':'me'} ${p.alive?'':'dead'}">${face(COL[p.i],!p.alive)}<div><div class="nm"><span>${p.name2} · ${p.name}</span><b>${won(p.money)}</b></div><div class="track"><div class="bar" style="width:${Math.max(3,(Math.log10(Math.max(p.money,1))-min)/(max-min)*100)}%;background:${COL[p.i]}"></div></div></div></div>`).join('')}</div>`}
function home(){const s=store();
  $.innerHTML=`<h1>같은 1초에 태어난 5명,<br>누가 제일 부자가 될까</h1>
  <p class="sub">태어날 나라는 못 고릅니다. 실제 세계 출생 통계로 정해져요.<br>돈을 어디에 둘지만 고르세요.</p>
  ${G0card()}
  <div class="btns"><button class="main" id="go">태어나기</button><button class="ghost" id="day">오늘의 5명 (모두 같은 출발선)</button>
  <p class="sub" style="text-align:center">가상의 돈으로 하는 게임입니다${s.seen?` · 태어나본 나라 ${s.seen.length}/${D.length}`:''}${s.best?` · 최고 ${won(s.best)}`:''}</p></div>`;
  go.onclick=()=>start(Math.floor(Math.random()*2e9));day.onclick=()=>start(daily())}
function G0card(){return `<div class="card">${[0,1,2,3,4].map(i=>`<div class="row">${face(COL[i])}<div class="track"><div class="bar" style="width:${[92,18,41,8,60][i]}%;background:${COL[i]}"></div></div></div>`).join('')}</div>`}
function start(seed){G=deal(seed);round=0;
  const s=store();s.seen=[...new Set([...(s.seen||[]),G.ppl[0].code])];save(s);
  const me=G.ppl[0],c=me.c,ch=(c[3]/TOTAL*100);
  $.innerHTML=`<h2 style="margin-top:18px">${me.name}에서 태어났습니다</h2>
  <p class="sub">${ch<1?'세계 아기 100명 중 1명도 안 되는 드문 출발선이에요.':'세계 아기 100명 중 약 '+Math.round(ch)+'명이 여기서 태어나요.'}<br>이 나라 평균 수명 ${c[2]}세, 1인당 벌이 연 ${won(c[1]*WON)}</p>
  ${board()}<p class="sub">막대가 길수록 부자. 같은 1초에 태어난 네 명과 겨룹니다.</p>
  <div class="btns"><button class="main" id="n">스무 살이 되기</button></div>`;n.onclick=turn}
function turn(){const me=G.ppl[0],age=AGES[round];
  if(round>=AGES.length||age>=me.die)return finish();
  const w=G.world[round],M=MOODS[w.m];
  $.innerHTML=`<div class="top"><span>${age}세</span><span>${won(me.money)}</span></div>${board()}
  <div class="mood ${M.c}">${M.t}</div>
  <p style="font-weight:700">앞으로 10년, 내 돈을 어디에 둘까?</p>
  <div class="picks">${PICKS.map((p,i)=>`<button class="pick" data-i="${i}">${ICON[i]}<b>${p.n}</b><small>${p.d}</small></button>`).join('')}</div>
  <div class="news" id="news"></div>`;
  document.querySelectorAll('.pick').forEach(b=>b.onclick=()=>choose(+b.dataset.i))}
function choose(i){const w=G.world[round],age=AGES[round];
  document.querySelectorAll('.pick').forEach(b=>b.disabled=true);
  G.ppl.forEach(p=>step(p,w,p.i?RIVAL[p.i-1][1](w.m):i,age));
  (G.log=G.log||[]).push(w.o);
  const [t,c]=OUT[w.o],b=document.querySelector('.card');b.outerHTML=board();
  news.textContent=t;news.className='news '+c;round++;setTimeout(turn,q.has('fast')?0:1300)}
function finish(){const me=G.ppl[0];
  // 내가 떠난 뒤의 세상도 끝까지 돌린다
  for(;round<AGES.length;round++){const w=G.world[round];G.ppl.forEach((p,k)=>k&&step(p,w,RIVAL[p.i-1][1](w.m),AGES[round]))}
  const all=[...G.ppl].sort((a,b)=>b.money-a.money),rank=all.indexOf(me)+1;
  const s=store();if(!s.best||me.money>s.best)s.best=me.money;save(s);
  const beat=all.find(p=>p.money>me.money);
  const msg=rank==1?'다섯 명 중 가장 부자로 눈을 감았습니다':`${beat.name}에서 태어난 ${beat.name2}보다 ${won(beat.money-me.money)} 모자랐습니다`;
  const url=location.origin+location.pathname+'?s='+G.seed;
  const text=`출발선 머니게임\n${me.name}에서 태어나 ${me.die}세까지, ${won(me.money)}\n같은 1초에 태어난 5명 중 ${rank}등\n같은 출발선에서 붙어봐: ${url}`;
  $.innerHTML=`<p class="sub" style="margin-top:14px">${me.name}에서 태어나 ${me.die}세에 눈을 감았습니다</p><div class="big">${rank}등 · ${won(me.money)}</div><p>${msg}</p>
  ${board()}
  <div class="btns"><div class="two"><button class="ghost" id="sh">친구와 붙기</button><button class="ghost" id="cd">카드 저장</button></div><button class="main" id="re">다시 태어나기</button>
  <p class="sub" style="text-align:center">다음엔 어느 나라일까요? 태어나본 나라 ${s.seen.length}/${D.length}</p></div>`;
  re.onclick=()=>start(Math.floor(Math.random()*2e9));
  sh.onclick=async()=>{try{if(navigator.share)await navigator.share({text});else{await navigator.clipboard.writeText(text);sh.textContent='복사했어요'}}catch(e){}};
  cd.onclick=()=>card(me,rank)}
function card(me,rank){const c=document.createElement('canvas');c.width=1080;c.height=1080;const x=c.getContext('2d'),f='"Apple SD Gothic Neo","Noto Sans KR",sans-serif';
  x.fillStyle='#fff8ec';x.fillRect(0,0,1080,1080);x.fillStyle='#3a3128';x.font='700 60px '+f;x.fillText('출발선 머니게임',80,150);
  x.font='48px '+f;x.fillText(me.name+'에서 태어나',80,300);x.fillText(me.die+'세까지 살았습니다',80,370);
  x.fillStyle='#e8743b';x.font='800 110px '+f;x.fillText(won(me.money),80,540);x.fillStyle='#3a3128';x.font='700 56px '+f;x.fillText('같은 1초에 태어난 5명 중 '+rank+'등',80,650);
  [...G.ppl].sort((a,b)=>b.money-a.money).forEach((p,i)=>{x.fillStyle=COL[p.i];x.fillRect(80,720+i*56,Math.max(20,Math.log10(Math.max(p.money,1e5))*80),36);x.fillStyle='#3a3128';x.font='32px '+f;x.fillText(p.name,860-180,750+i*56)});
  const a=document.createElement('a');a.download='moneygame.png';a.href=c.toDataURL();a.click()}
q.has('s')?start(+q.get('s')):home();
</script></body></html>
